<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 3.9 — Class Diagram</title>
<link rel="stylesheet" href="diagram.css">
<style>
  .figure { width:1320px; }
  .cls { fill:var(--surface); stroke:currentColor; stroke-width:1.3; }
  .cls-bar { fill:var(--surface-2); stroke:currentColor; stroke-width:1.3; }
  .svc-bar { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.3; }
  .cls-name { font-family:var(--font-body); font-weight:700; font-size:11.5px; fill:currentColor; text-anchor:middle; }
  .cls-stereo { font-family:var(--font-mono); font-size:8.5px; fill:var(--text-muted); text-anchor:middle; }
  .cls-mem { font-family:var(--font-mono); font-size:9px; fill:var(--text); }
  .cls-div { stroke:var(--border-strong); stroke-width:1; }
  .assoc { stroke:currentColor; stroke-width:1.2; fill:none; }
  .dep { stroke:var(--text-muted); stroke-width:1.1; fill:none; stroke-dasharray:5 3; }
  .mult { font-family:var(--font-mono); font-size:9px; fill:var(--text-muted); }
</style>
</head>
<body>
<figure class="figure" id="figure">
  <p class="figure__eyebrow">Figure 3.9</p>
  <h2 class="figure__title">Class diagram</h2>

  <svg viewBox="0 0 1365 700" role="img" aria-label="Class diagram showing the domain entities Category, Product, OrderItem, Order, Customer, Address, CustomRequest, Enquiry and AdminUser, the enumerations OrderStatus, CustomRequestStatus and ProductNature, and the service classes CatalogueService, OrderService, CustomRequestService and AuthService. Category has many Products; Order is composed of many OrderItems; Product has many OrderItems; Customer has many Orders, Addresses and CustomRequests. Services depend on the entities they operate on.">
    <defs>
      <marker id="diamond" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="16" markerHeight="12" orient="auto">
        <path d="M1 6 L8 1 L15 6 L8 11 Z" fill="currentColor" stroke="currentColor"/>
      </marker>
      <marker id="oarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M0 0 L10 5 L0 10" fill="none" stroke="var(--text-muted)" stroke-width="1.2"/>
      </marker>
    </defs>

    <!-- Category -->
    <g>
      <rect class="cls" x="20" y="40" width="175" height="118"/>
      <rect class="cls-bar" x="20" y="40" width="175" height="22"/>
      <text class="cls-name" x="107" y="55">Category</text>
      <line class="cls-div" x1="20" y1="62" x2="195" y2="62"/>
      <text class="cls-mem" x="27" y="76">+ Id : int</text>
      <text class="cls-mem" x="27" y="89">+ Name : string</text>
      <text class="cls-mem" x="27" y="102">+ Slug : string</text>
      <text class="cls-mem" x="27" y="115">+ SortOrder : int</text>
      <text class="cls-mem" x="27" y="128">+ IsActive : bool</text>
      <line class="cls-div" x1="20" y1="136" x2="195" y2="136"/>
      <text class="cls-mem" x="27" y="150">+ Products : List</text>
    </g>

    <!-- Product -->
    <g>
      <rect class="cls" x="245" y="40" width="195" height="184"/>
      <rect class="cls-bar" x="245" y="40" width="195" height="22"/>
      <text class="cls-name" x="342" y="55">Product</text>
      <line class="cls-div" x1="245" y1="62" x2="440" y2="62"/>
      <text class="cls-mem" x="252" y="76">+ Id : int</text>
      <text class="cls-mem" x="252" y="89">+ CategoryId : int</text>
      <text class="cls-mem" x="252" y="102">+ Name : string</text>
      <text class="cls-mem" x="252" y="115">+ Slug : string</text>
      <text class="cls-mem" x="252" y="128">+ Price : decimal</text>
      <text class="cls-mem" x="252" y="141">+ Nature : ProductNature</text>
      <text class="cls-mem" x="252" y="154">+ Availability : Availability</text>
      <text class="cls-mem" x="252" y="167">+ LeadTimeDays : int</text>
      <text class="cls-mem" x="252" y="180">+ IsCustomizable : bool</text>
      <text class="cls-mem" x="252" y="193">+ IsActive : bool</text>
    </g>

    <!-- OrderItem -->
    <g>
      <rect class="cls" x="490" y="40" width="185" height="132"/>
      <rect class="cls-bar" x="490" y="40" width="185" height="22"/>
      <text class="cls-name" x="582" y="55">OrderItem</text>
      <line class="cls-div" x1="490" y1="62" x2="675" y2="62"/>
      <text class="cls-mem" x="497" y="76">+ Id : int</text>
      <text class="cls-mem" x="497" y="89">+ OrderId : int</text>
      <text class="cls-mem" x="497" y="102">+ ProductId : int</text>
      <text class="cls-mem" x="497" y="115">+ ProductName : string</text>
      <text class="cls-mem" x="497" y="128">+ UnitPrice : decimal</text>
      <text class="cls-mem" x="497" y="141">+ Quantity : int</text>
      <text class="cls-mem" x="497" y="154">+ LineTotal : decimal</text>
    </g>

    <!-- Order -->
    <g>
      <rect class="cls" x="725" y="40" width="205" height="210"/>
      <rect class="cls-bar" x="725" y="40" width="205" height="22"/>
      <text class="cls-name" x="827" y="55">Order</text>
      <line class="cls-div" x1="725" y1="62" x2="930" y2="62"/>
      <text class="cls-mem" x="732" y="76">+ Id : int</text>
      <text class="cls-mem" x="732" y="89">+ OrderNumber : string</text>
      <text class="cls-mem" x="732" y="102">+ CustomerId : int</text>
      <text class="cls-mem" x="732" y="115">+ Status : OrderStatus</text>
      <text class="cls-mem" x="732" y="128">+ Subtotal : decimal</text>
      <text class="cls-mem" x="732" y="141">+ DeliveryFee : decimal</text>
      <text class="cls-mem" x="732" y="154">+ Total : decimal</text>
      <text class="cls-mem" x="732" y="167">+ DeliveryDate : date</text>
      <text class="cls-mem" x="732" y="180">+ DeliverySlot : string</text>
      <text class="cls-mem" x="732" y="193">+ GiftMessage : string?</text>
      <line class="cls-div" x1="725" y1="201" x2="930" y2="201"/>
      <text class="cls-mem" x="732" y="215">+ Items : List&lt;OrderItem&gt;</text>
      <text class="cls-mem" x="732" y="228">+ RecalculateTotals()</text>
    </g>

    <!-- Customer -->
    <g>
      <rect class="cls" x="980" y="40" width="190" height="170"/>
      <rect class="cls-bar" x="980" y="40" width="190" height="22"/>
      <text class="cls-name" x="1075" y="55">Customer</text>
      <line class="cls-div" x1="980" y1="62" x2="1170" y2="62"/>
      <text class="cls-mem" x="987" y="76">+ Id : int</text>
      <text class="cls-mem" x="987" y="89">+ Name : string</text>
      <text class="cls-mem" x="987" y="102">+ Email : string</text>
      <text class="cls-mem" x="987" y="115">+ Phone : string</text>
      <text class="cls-mem" x="987" y="128">- PasswordHash : string?</text>
      <text class="cls-mem" x="987" y="141">+ IsRegistered : bool</text>
      <line class="cls-div" x1="980" y1="149" x2="1170" y2="149"/>
      <text class="cls-mem" x="987" y="163">+ Orders : List</text>
      <text class="cls-mem" x="987" y="176">+ Addresses : List</text>
      <text class="cls-mem" x="987" y="189">+ CustomRequests : List</text>
    </g>

    <!-- Address -->
    <g>
      <rect class="cls" x="980" y="250" width="190" height="118"/>
      <rect class="cls-bar" x="980" y="250" width="190" height="22"/>
      <text class="cls-name" x="1075" y="265">Address</text>
      <line class="cls-div" x1="980" y1="272" x2="1170" y2="272"/>
      <text class="cls-mem" x="987" y="286">+ Id : int</text>
      <text class="cls-mem" x="987" y="299">+ CustomerId : int</text>
      <text class="cls-mem" x="987" y="312">+ RecipientName : string</text>
      <text class="cls-mem" x="987" y="325">+ Line1 : string</text>
      <text class="cls-mem" x="987" y="338">+ City : string</text>
      <text class="cls-mem" x="987" y="351">+ PostalCode : string</text>
    </g>

    <!-- CustomRequest -->
    <g>
      <rect class="cls" x="700" y="300" width="220" height="170"/>
      <rect class="cls-bar" x="700" y="300" width="220" height="22"/>
      <text class="cls-name" x="810" y="315">CustomRequest</text>
      <line class="cls-div" x1="700" y1="322" x2="920" y2="322"/>
      <text class="cls-mem" x="707" y="336">+ Id : int</text>
      <text class="cls-mem" x="707" y="349">+ RequestNumber : string</text>
      <text class="cls-mem" x="707" y="362">+ CustomerId : int?</text>
      <text class="cls-mem" x="707" y="375">+ Occasion : string</text>
      <text class="cls-mem" x="707" y="388">+ Palette : string</text>
      <text class="cls-mem" x="707" y="401">+ BudgetMin/Max : decimal</text>
      <text class="cls-mem" x="707" y="414">+ NeedByDate : date</text>
      <text class="cls-mem" x="707" y="427">+ Status : CustomRequestStatus</text>
      <text class="cls-mem" x="707" y="440">+ QuotedPrice : decimal?</text>
    </g>

    <!-- Enquiry -->
    <g>
      <rect class="cls" x="20" y="200" width="175" height="118"/>
      <rect class="cls-bar" x="20" y="200" width="175" height="22"/>
      <text class="cls-name" x="107" y="215">Enquiry</text>
      <line class="cls-div" x1="20" y1="222" x2="195" y2="222"/>
      <text class="cls-mem" x="27" y="236">+ Id : int</text>
      <text class="cls-mem" x="27" y="249">+ Name : string</text>
      <text class="cls-mem" x="27" y="262">+ Email : string</text>
      <text class="cls-mem" x="27" y="275">+ Message : string</text>
      <text class="cls-mem" x="27" y="288">+ IsHandled : bool</text>
      <text class="cls-mem" x="27" y="301">+ CreatedAt : datetime</text>
    </g>

    <!-- AdminUser -->
    <g>
      <rect class="cls" x="20" y="340" width="175" height="112"/>
      <rect class="cls-bar" x="20" y="340" width="175" height="22"/>
      <text class="cls-name" x="107" y="355">AdminUser</text>
      <line class="cls-div" x1="20" y1="362" x2="195" y2="362"/>
      <text class="cls-mem" x="27" y="376">+ Id : int</text>
      <text class="cls-mem" x="27" y="389">+ Name : string</text>
      <text class="cls-mem" x="27" y="402">+ Username : string</text>
      <text class="cls-mem" x="27" y="415">- PasswordHash : string</text>
      <text class="cls-mem" x="27" y="428">+ LastLoginAt : datetime?</text>
    </g>

    <!-- enums -->
    <g>
      <rect class="cls" x="1200" y="40" width="150" height="84"/>
      <rect class="cls-bar" x="1200" y="40" width="150" height="32"/>
      <text class="cls-stereo" x="1275" y="53">&laquo;enumeration&raquo;</text>
      <text class="cls-name" x="1275" y="66" font-size="10">OrderStatus</text>
      <text class="cls-mem" x="1208" y="88" font-size="8.5">pending … delivered</text>
      <text class="cls-mem" x="1208" y="101" font-size="8.5">cancelled</text>
    </g>
    <g>
      <rect class="cls" x="1200" y="152" width="150" height="72"/>
      <rect class="cls-bar" x="1200" y="152" width="150" height="32"/>
      <text class="cls-stereo" x="1275" y="165">&laquo;enumeration&raquo;</text>
      <text class="cls-name" x="1275" y="178" font-size="10">CustomRequestStatus</text>
      <text class="cls-mem" x="1208" y="200" font-size="8.5">new … closed</text>
    </g>
    <g>
      <rect class="cls" x="1200" y="252" width="150" height="84"/>
      <rect class="cls-bar" x="1200" y="252" width="150" height="32"/>
      <text class="cls-stereo" x="1275" y="265">&laquo;enumeration&raquo;</text>
      <text class="cls-name" x="1275" y="278" font-size="10">ProductNature</text>
      <text class="cls-mem" x="1208" y="300" font-size="8.5">everlasting</text>
      <text class="cls-mem" x="1208" y="313" font-size="8.5">fresh</text>
    </g>

    <!-- services -->
    <g>
      <rect class="cls" x="20" y="500" width="215" height="98"/>
      <rect class="svc-bar" x="20" y="500" width="215" height="30"/>
      <text class="cls-stereo" x="127" y="512">&laquo;service&raquo;</text>
      <text class="cls-name" x="127" y="524" fill="var(--accent)">CatalogueService</text>
      <text class="cls-mem" x="27" y="546">+ GetCategories()</text>
      <text class="cls-mem" x="27" y="559">+ GetProducts(filter)</text>
      <text class="cls-mem" x="27" y="572">+ GetProductBySlug(slug)</text>
    </g>
    <g>
      <rect class="cls" x="265" y="500" width="235" height="112"/>
      <rect class="svc-bar" x="265" y="500" width="235" height="30"/>
      <text class="cls-stereo" x="382" y="512">&laquo;service&raquo;</text>
      <text class="cls-name" x="382" y="524" fill="var(--accent)">OrderService</text>
      <text class="cls-mem" x="272" y="546">+ CreateAsync(request)</text>
      <text class="cls-mem" x="272" y="559">+ GetForCustomerAsync(no, email)</text>
      <text class="cls-mem" x="272" y="572">+ UpdateStatusAsync(id, status)</text>
      <text class="cls-mem" x="272" y="585">- ValidateDeliveryDate(p, date)</text>
    </g>
    <g>
      <rect class="cls" x="530" y="500" width="235" height="98"/>
      <rect class="svc-bar" x="530" y="500" width="235" height="30"/>
      <text class="cls-stereo" x="647" y="512">&laquo;service&raquo;</text>
      <text class="cls-name" x="647" y="524" fill="var(--accent)">CustomRequestService</text>
      <text class="cls-mem" x="537" y="546">+ CreateAsync(request)</text>
      <text class="cls-mem" x="537" y="559">+ RespondAsync(id, response, price)</text>
      <text class="cls-mem" x="537" y="572">+ SetStatusAsync(id, status)</text>
    </g>
    <g>
      <rect class="cls" x="795" y="500" width="210" height="98"/>
      <rect class="svc-bar" x="795" y="500" width="210" height="30"/>
      <text class="cls-stereo" x="900" y="512">&laquo;service&raquo;</text>
      <text class="cls-name" x="900" y="524" fill="var(--accent)">AuthService</text>
      <text class="cls-mem" x="802" y="546">+ Register(name, email, pwd)</text>
      <text class="cls-mem" x="802" y="559">+ Login(email, pwd)</text>
      <text class="cls-mem" x="802" y="572">+ IssueToken(principal)</text>
    </g>

    <!-- associations -->
    <path class="assoc" d="M195 92 L245 92" marker-start="url(#diamond)"/>
    <text class="mult" x="205" y="86">1</text><text class="mult" x="226" y="86">*</text>

    <path class="assoc" d="M440 120 L490 110" marker-end="url(#oarr)"/>
    <text class="mult" x="448" y="112">*</text>

    <path class="assoc" d="M725 150 L675 130" marker-start="url(#diamond)"/>
    <text class="mult" x="690" y="126">1</text><text class="mult" x="683" y="146">*</text>

    <path class="assoc" d="M980 120 L930 120" marker-start="url(#diamond)"/>
    <text class="mult" x="965" y="114">1</text><text class="mult" x="940" y="114">*</text>

    <path class="assoc" d="M1075 210 L1075 250" marker-start="url(#diamond)"/>
    <text class="mult" x="1080" y="226">1</text><text class="mult" x="1080" y="246">*</text>

    <path class="assoc" d="M980 175 C 930 240, 900 300, 900 300" marker-start="url(#diamond)"/>
    <text class="mult" x="940" y="210">1</text><text class="mult" x="905" y="292">0..*</text>

    <!-- dependencies -->
    <path class="dep" d="M382 500 C 500 380, 650 280, 800 250" marker-end="url(#oarr)"/>
    <path class="dep" d="M420 500 C 520 420, 620 200, 675 175" marker-end="url(#oarr)"/>
    <path class="dep" d="M127 500 C 160 360, 240 250, 300 224" marker-end="url(#oarr)"/>
    <path class="dep" d="M647 500 L790 470" marker-end="url(#oarr)"/>
    <path class="dep" d="M900 500 C 950 360, 1030 240, 1070 210" marker-end="url(#oarr)"/>
  </svg>

  <figcaption class="figure__cap">
    Filled diamonds mark composition (an <span class="mono">Order</span> owns its
    <span class="mono">OrderItem</span>s). Dashed arrows are dependencies &mdash; each service
    operates on the entities it points to. Enumerations back the status and type fields.
  </figcaption>
</figure>
</body>
</html>
