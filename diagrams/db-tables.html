<!doctype html>

<style>

<figure class="figure" id="figure">

        <div class="row" style="padding-left:106px"><span class="tw">▸</span> Sequences (2)</div>
      </div>

      <div class="pg__work">
        <div class="pg__tabs"><span>Query</span><span class="on">Data Output</span><span>Messages</span><span>Notifications</span></div>
        <div class="pg__sql"><span class="kw">SELECT</span> * <span class="kw">FROM</span> products <span class="kw">ORDER BY</span> id;</div>
        <div class="pg__pillbar"><span>public.products</span><span>9 columns</span><span>6 rows</span></div>
        <div class="pg__grid">
          <table class="pgt">

              <tr><td class="n">4</td><td class="n">3</td><td>Morning Market Fresh Bunch</td><td class="mono">morning-market-fresh-bunch</td><td class="n">900.00</td><td>fresh</td><td>available</td><td class="n">1</td><td class="mono">true</td></tr>
              <tr><td class="n">5</td><td class="n">3</td><td>Golden Hour Fresh &amp; Gift</td><td class="mono">golden-hour-fresh-gift</td><td class="n">1350.00</td><td>fresh</td><td>available</td><td class="n">1</td><td class="mono">true</td></tr>
              <tr><td class="n">6</td><td class="n">4</td><td>Petite Everlasting Jar</td><td class="mono">petite-everlasting-jar</td><td class="n">550.00</td><td>everlasting</td><td>sold_out</td><td class="n">5</td><td class="mono">true</td></tr>

    </div>

  <figcaption class="figure__cap">
    The nine tables of the <span class="mono">fleurea</span> database in the <span class="mono">public</span>

    project's seed script.
  </figcaption>
</figure>
