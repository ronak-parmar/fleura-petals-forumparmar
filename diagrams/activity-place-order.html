<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 3.7 — Activity Diagram: Place an Order</title>
<link rel="stylesheet" href="diagram.css">
<style>
  .figure { width:900px; }
  .act { fill:var(--surface); stroke:currentColor; stroke-width:1.3; }
  .act-sys { fill:var(--surface-2); stroke:currentColor; stroke-width:1.3; }
  .act-txt { font-family:var(--font-body); font-size:11.5px; fill:currentColor; text-anchor:middle; }
  .dec { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.4; }
  .dec-txt { font-family:var(--font-body); font-size:11px; fill:currentColor; text-anchor:middle; }
  .flw { stroke:currentColor; stroke-width:1.4; fill:none; }
  .brnlbl { font-family:var(--font-mono); font-size:10px; fill:var(--text-muted); }
</style>
</head>
<body>
<figure class="figure" id="figure">
  <p class="figure__eyebrow">Figure 3.7</p>
  <h2 class="figure__title">Activity diagram &mdash; Place an order</h2>

  <svg viewBox="0 0 720 980" role="img" aria-label="Activity diagram for placing an order. Start, browse catalogue, open product, add to cart, decision more items which loops back to browse or continues, open cart, proceed to checkout, enter contact and delivery details, choose delivery date and slot, decision date valid which on no shows a date error and returns to choose date or on yes continues, review order, place order, system saves order and items in a transaction, show confirmation with order number, end.">
    <defs>
      <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
      </marker>
    </defs>

    <circle cx="300" cy="24" r="9" fill="currentColor"/>

    <rect class="act" x="190" y="46"  width="220" height="38" rx="19"/><text class="act-txt" x="300" y="70">Browse catalogue</text>
    <rect class="act" x="190" y="108" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="132">Open product</text>
    <rect class="act" x="190" y="170" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="194">Add to cart</text>

    <polygon class="dec" points="300,224 372,258 300,292 228,258"/>
    <text class="dec-txt" x="300" y="262">More items?</text>

    <rect class="act" x="190" y="316" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="340">Open cart</text>
    <rect class="act" x="190" y="378" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="402">Proceed to checkout</text>
    <rect class="act" x="190" y="440" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="464">Enter contact &amp; delivery details</text>
    <rect class="act" x="190" y="502" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="526">Choose delivery date &amp; slot</text>

    <polygon class="dec" points="300,556 384,592 300,628 216,592"/>
    <text class="dec-txt" x="300" y="590">Date valid</text>
    <text class="dec-txt" x="300" y="604">for items?</text>

    <rect class="act" x="190" y="652" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="676">Review order</text>
    <rect class="act" x="190" y="714" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="738">Place order</text>
    <rect class="act-sys" x="170" y="776" width="260" height="46" rx="8"/>
    <text class="act-txt" x="300" y="795">System: save order + items</text>
    <text class="act-txt" x="300" y="811" font-size="10" fill="var(--text-muted)">(single database transaction)</text>
    <rect class="act" x="190" y="846" width="220" height="38" rx="19"/><text class="act-txt" x="300" y="870">Show confirmation + order number</text>

    <circle cx="300" cy="922" r="11" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="300" cy="922" r="6" fill="currentColor"/>

    <!-- main flow -->
    <path class="flw" d="M300 33 L300 44" marker-end="url(#af)"/>
    <path class="flw" d="M300 84 L300 106" marker-end="url(#af)"/>
    <path class="flw" d="M300 146 L300 168" marker-end="url(#af)"/>
    <path class="flw" d="M300 208 L300 222" marker-end="url(#af)"/>
    <path class="flw" d="M300 292 L300 314" marker-end="url(#af)"/>
    <text class="brnlbl" x="308" y="308">no</text>
    <path class="flw" d="M300 354 L300 376" marker-end="url(#af)"/>
    <path class="flw" d="M300 416 L300 438" marker-end="url(#af)"/>
    <path class="flw" d="M300 478 L300 500" marker-end="url(#af)"/>
    <path class="flw" d="M300 540 L300 554" marker-end="url(#af)"/>
    <path class="flw" d="M300 628 L300 650" marker-end="url(#af)"/>
    <text class="brnlbl" x="308" y="644">yes</text>
    <path class="flw" d="M300 690 L300 712" marker-end="url(#af)"/>
    <path class="flw" d="M300 752 L300 774" marker-end="url(#af)"/>
    <path class="flw" d="M300 822 L300 844" marker-end="url(#af)"/>
    <path class="flw" d="M300 884 L300 910" marker-end="url(#af)"/>

    <!-- loop: more items? yes -> browse catalogue -->
    <path class="flw" d="M372 258 L620 258 L620 65 L412 65" marker-end="url(#af)"/>
    <text class="brnlbl" x="500" y="252">yes</text>

    <!-- loop: date invalid -> error -> choose date -->
    <rect class="act" x="452" y="540" width="196" height="36" rx="8"/>
    <text class="act-txt" x="550" y="562" font-size="10.5">Show date error message</text>
    <path class="flw" d="M384 592 L550 592 L550 578" marker-end="url(#af)"/>
    <text class="brnlbl" x="430" y="586">no</text>
    <path class="flw" d="M452 552 C 430 545, 420 535, 412 524" marker-end="url(#af)"/>
  </svg>

  <figcaption class="figure__cap">
    The delivery-date check applies each product's nature and lead time (see Figure 3.2). The order
    and all of its line items are written in one transaction, so a partial order can never be stored.
  </figcaption>
</figure>
</body>
</html>
