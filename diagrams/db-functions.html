<pre class="pg__code"><span class="cm">-- public.fn_place_order(...)  —  called by OrderService.CreateAsync()</span>
<span class="kw">CREATE OR REPLACE FUNCTION</span> fn_place_order(
    p_contact_name text, p_contact_email text, p_contact_phone text,
    p_recipient_name text, p_recipient_phone text,
    p_line1 text, p_line2 text, p_city text, p_state text,
    p_postal_code text, p_landmark text,
    p_delivery_date date, p_delivery_slot text,
    p_gift_message text, p_customer_note text,
    p_items jsonb                       <span class="cm">-- [{"product_id":1,"quantity":2}, ...]</span>
) <span class="kw">RETURNS</span> orders <span class="kw">AS</span> $$
<span class="kw">DECLARE</span>
    v_customer_id  int;
    v_order        orders;
    v_item         jsonb;
    v_product      products;
    v_qty          int;
    v_delivery_fee numeric(10,2) := 80.00;
    v_free_over    numeric(10,2) := 1500.00;
<span class="kw">BEGIN</span>
    <span class="kw">IF</span> p_items <span class="kw">IS NULL</span> <span class="kw">OR</span> jsonb_array_length(p_items) = 0 <span class="kw">THEN</span>
        <span class="kw">RAISE EXCEPTION</span> <span class="st">'EMPTY_ORDER'</span>;
    <span class="kw">END IF</span>;

    v_customer_id := fn_upsert_guest_customer(p_contact_name, p_contact_email, p_contact_phone);

    <span class="kw">INSERT INTO</span> orders (order_number, customer_id, status, recipient_name, recipient_phone,
        address_line1, address_line2, city, state, postal_code, landmark,
        delivery_date, delivery_slot, gift_message, customer_note)
    <span class="kw">VALUES</span> (fn_next_order_number(), v_customer_id, <span class="st">'pending'</span>, p_recipient_name, p_recipient_phone,
        p_line1, coalesce(p_line2,<span class="st">''</span>), p_city, coalesce(p_state,<span class="st">'Maharashtra'</span>),
        p_postal_code, coalesce(p_landmark,<span class="st">''</span>),
        p_delivery_date, p_delivery_slot::delivery_slot, p_gift_message, p_customer_note)
    <span class="kw">RETURNING</span> * <span class="kw">INTO</span> v_order;

    <span class="kw">FOR</span> v_item <span class="kw">IN SELECT</span> * <span class="kw">FROM</span> jsonb_array_elements(p_items) <span class="kw">LOOP</span>
        v_qty := greatest((v_item-&gt;&gt;<span class="st">'quantity'</span>)::int, 1);

        <span class="kw">SELECT</span> * <span class="kw">INTO</span> v_product <span class="kw">FROM</span> products
        <span class="kw">WHERE</span>  id = (v_item-&gt;&gt;<span class="st">'product_id'</span>)::int <span class="kw">AND</span> is_active;

        <span class="kw">IF NOT FOUND THEN</span> <span class="kw">RAISE EXCEPTION</span> <span class="st">'PRODUCT_NOT_FOUND: %'</span>, v_item-&gt;&gt;<span class="st">'product_id'</span>; <span class="kw">END IF</span>;
        <span class="kw">IF</span> v_product.availability = <span class="st">'sold_out'</span> <span class="kw">THEN</span>
            <span class="kw">RAISE EXCEPTION</span> <span class="st">'PRODUCT_SOLD_OUT: %'</span>, v_product.name; <span class="kw">END IF</span>;
        <span class="kw">IF</span> v_product.nature = <span class="st">'everlasting'</span>
           <span class="kw">AND</span> p_delivery_date &lt; current_date + v_product.lead_time_days <span class="kw">THEN</span>
            <span class="kw">RAISE EXCEPTION</span> <span class="st">'DELIVERY_TOO_SOON: % needs % day(s)'</span>,
                v_product.name, v_product.lead_time_days; <span class="kw">END IF</span>;

        <span class="kw">INSERT INTO</span> order_items (order_id, product_id, product_name, unit_price, quantity, line_total)
        <span class="kw">VALUES</span> (v_order.id, v_product.id, v_product.name, v_product.price,
                v_qty, v_product.price * v_qty);
    <span class="kw">END LOOP</span>;

    <span class="cm">-- totals are computed here, from the rows just inserted — never from the caller</span>
    <span class="kw">UPDATE</span> orders o
       <span class="kw">SET</span> subtotal     = s.subtotal,
           delivery_fee = <span class="kw">CASE WHEN</span> s.subtotal &gt;= v_free_over <span class="kw">THEN</span> 0 <span class="kw">ELSE</span> v_delivery_fee <span class="kw">END</span>,
           total        = s.subtotal + <span class="kw">CASE WHEN</span> s.subtotal &gt;= v_free_over <span class="kw">THEN</span> 0 <span class="kw">ELSE</span> v_delivery_fee <span class="kw">END</span>
      <span class="kw">FROM</span> (<span class="kw">SELECT</span> sum(line_total) <span class="kw">AS</span> subtotal <span class="kw">FROM</span> order_items <span class="kw">WHERE</span> order_id = v_order.id) s
     <span class="kw">WHERE</span> o.id = v_order.id
    <span class="kw">RETURNING</span> o.* <span class="kw">INTO</span> v_order;

    <span class="kw">RETURN</span> v_order;
<span class="kw">END</span>;
$$ <span class="kw">LANGUAGE</span> plpgsql;</pre>

  <figcaption class="figure__cap">
    The API services call these functions rather than composing SQL in C#. Each read or write
    has one function &mdash; so numbering (<span class="mono">fn_next_order_number</span>), pricing and the
    delivery-date rules live in the database. <span class="mono">fn_place_order</span> re-prices every line
    from the <span class="mono">products</span> table and writes the order and its items together.
  </figcaption>
