<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 3.1 — System Architecture</title>
<link rel="stylesheet" href="diagram.css">
</head>
<body>
<figure class="figure" id="figure">
  <p class="figure__eyebrow">Figure 3.1</p>
  <h2 class="figure__title">System architecture of Fleuréa Petals</h2>

  <svg viewBox="0 0 1000 470" role="img" aria-label="Three-tier architecture: a Next.js presentation layer calls the ASP.NET Core Web API over REST, which reaches PostgreSQL through Entity Framework Core.">
    <defs>
      <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
      </marker>
    </defs>

    <!-- Tier 1 -->
    <rect class="d-node" x="230" y="24" width="540" height="104" rx="9"/>
    <text class="d-name" x="500" y="52" text-anchor="middle">PRESENTATION LAYER</text>
    <text class="d-text" x="500" y="76" text-anchor="middle">Next.js · React · TypeScript · Tailwind CSS</text>
    <text class="d-small" x="500" y="98" text-anchor="middle">Customer site (server-rendered catalogue, client cart &amp; forms)</text>
    <text class="d-small" x="500" y="115" text-anchor="middle">Administrator panel</text>

    <line class="d-flow" x1="500" y1="128" x2="500" y2="176" marker-end="url(#a1)"/>
    <text class="d-lbl" x="514" y="156">HTTPS · JSON · REST  /api/v1</text>

    <!-- Tier 2 -->
    <rect class="d-hot" x="230" y="178" width="540" height="116" rx="9"/>
    <text class="d-name" x="500" y="206" text-anchor="middle" fill="var(--accent)">APPLICATION LAYER</text>
    <text class="d-text" x="500" y="230" text-anchor="middle">ASP.NET Core Web API (.NET)</text>
    <text class="d-small" x="500" y="252" text-anchor="middle">Controllers → Services → Repositories</text>
    <text class="d-small" x="500" y="269" text-anchor="middle">JWT auth (customer + admin) · FluentValidation · server-side order pricing</text>
    <text class="d-small" x="500" y="286" text-anchor="middle">Swagger / OpenAPI</text>

    <line class="d-flow" x1="500" y1="294" x2="500" y2="342" marker-end="url(#a1)"/>
    <text class="d-lbl" x="514" y="322">Entity Framework Core · Npgsql</text>

    <!-- Tier 3 -->
    <rect class="d-node-2" x="230" y="344" width="540" height="104" rx="9"/>
    <text class="d-name" x="500" y="372" text-anchor="middle">DATA LAYER</text>
    <text class="d-text" x="500" y="396" text-anchor="middle">PostgreSQL</text>
    <text class="d-small" x="500" y="418" text-anchor="middle">9 tables · EF Core migrations · seed script for demo data</text>

    <!-- side annotations -->
    <line class="d-flow-dash" x1="230" y1="76" x2="90" y2="76"/>
    <text class="d-lbl" x="86" y="72" text-anchor="end">Browser</text>
    <line class="d-flow-dash" x1="770" y1="236" x2="910" y2="236"/>
    <text class="d-lbl" x="914" y="232">New build</text>
  </svg>

  <figcaption class="figure__cap">
    The three tiers are developed and deployed as separate concerns. All money and validation
    decisions live in the application layer — the browser sends only product identifiers and
    quantities, and the server re-prices every order from the database.
  </figcaption>
</figure>
</body>
</html>
